name: CI

on:
  push:
  pull_request:

jobs:
  lint_and_unit:
    name: Lint + Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint (WPCS)
        run: composer lint

      - name: Unit tests
        run: composer test:unit


name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build_zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader

      - name: Prepare release directory
        run: |
          mkdir -p release/field-group-php-json-converter
          rsync -a --delete \
            --exclude="release" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="tests" \
            --exclude="phpunit.xml" \
            --exclude="phpcs.xml" \
            --exclude=".phpunit.result.cache" \
            --exclude=".phpunit.cache" \
            ./ release/field-group-php-json-converter/

      - name: Build zip
        run: |
          cd release
          zip -r "field-group-php-json-converter-${GITHUB_REF_NAME}.zip" field-group-php-json-converter

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: field-group-php-json-converter-${{ github.ref_name }}
          path: release/field-group-php-json-converter-${{ github.ref_name }}.zip
          if-no-files-found: error
